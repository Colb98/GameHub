<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fdf6e8" />
    <title>Prism Drop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", Arial, sans-serif;
        background: #f0e2cd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f0e2cd;
        touch-action: none;
        overscroll-behavior: none;
      }

      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Prism Drop endless color-matching descent game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
