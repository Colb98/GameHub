<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#05060f" />
    <title>Fluxball</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #02030a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 22%, rgba(0, 168, 214, 0.18), transparent 38%),
          radial-gradient(circle at 82% 76%, rgba(192, 20, 131, 0.16), transparent 42%),
          #02030a;
        touch-action: none;
        overscroll-behavior: none;
      }

      #game::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.13;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(130, 225, 255, 0.13) 4px
        );
        mix-blend-mode: screen;
      }

      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Fluxball magnetic pachinko game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
