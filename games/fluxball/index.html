<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#05060f" />
    <title>Fluxball</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Courier New", Consolas, monospace;
        background: #05060f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, #0b1024 0%, #05060f 68%);
        touch-action: none;
        overscroll-behavior: none;
      }

      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Fluxball magnetic pachinko game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
